<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <title>Bot Console Medieval</title>
    <style>
      html,
      body {
        min-height: 100%;
        margin: 0;
        background: #15141a;
        color: #eee3c8;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
      }

      #root {
        min-height: 100vh;
      }

      .boot-fallback {
        display: grid;
        min-height: 100vh;
        place-items: center;
        padding: 24px;
        color: #eee3c8;
      }

      .boot-fallback pre {
        max-width: min(760px, 100%);
        white-space: pre-wrap;
        color: #f3b3a2;
      }
    </style>
    <script>
      function showBootError(event) {
        var root = document.getElementById('root');
        if (!root) return;
        var message = event && (event.reason && event.reason.message || event.message || event.reason || 'Erro desconhecido');
        root.innerHTML = '<main class="boot-fallback"><pre>Erro ao carregar frontend:\n' + String(message) + '</pre></main>';
      }

      window.addEventListener('error', showBootError);
      window.addEventListener('unhandledrejection', showBootError);
    </script>
  </head>
  <body>
    <div id="root">
      <main class="boot-fallback">Carregando Bot Console Medieval...</main>
    </div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>

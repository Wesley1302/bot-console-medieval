services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: bot_console_medieval
      POSTGRES_USER: bot_console
      POSTGRES_PASSWORD: local-development-only
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - bcm_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bot_console -d bot_console_medieval"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  bcm_pgdata:
